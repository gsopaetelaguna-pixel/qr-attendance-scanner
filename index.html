<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #saveButton {
      background: #1976d2;
      color: white;
    }

    #saveButton:disabled {
      background: #999;
    }

    #scanAgainButton {
      background: #555;
      color: white;
    }

    #status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #dff5e1;
      color: #176b20;
    }

    .error {
      display: block !important;
      background: #ffe0e0;
      color: #a00000;
    }

    #quantitySection {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>QR Attendance Scanner</h1>

  <div id="reader"></div>


  <div id="quantitySection">

    <label>Scanned Code</label>

    <input
      type="text"
      id="code"
      readonly
    >


    <label>Quantity</label>

    <input
      type="number"
      id="quantity"
      value="1"
      min="1"
      inputmode="numeric"
    >


    <button
      id="saveButton"
      onclick="saveScan()">

      SAVE SCAN

    </button>


    <button
      id="scanAgainButton"
      onclick="scanAgain()">

      SCAN AGAIN

    </button>

  </div>


  <div id="status"></div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   =====================================================

   REPLACE THE URL BELOW WITH YOUR ACTUAL
   GOOGLE APPS SCRIPT WEB APP URL.

   It should end with /exec.

   Example:

   https://script.google.com/macros/s/XXXXXXXX/exec

===================================================== */


const scriptUrl =
  "https://script.google.com/macros/s/AKfycby8wgmD0iGMz4083SKiI-YEqs2Sdu9Fsdd4uwabF-C1aVPGpiAGBym723hiE9KWVbJPHQ/exec";



/* =====================================================
   SCANNER VARIABLES
===================================================== */

let scanner = null;

let scanning = false;



/* =====================================================
   START QR SCANNER
===================================================== */

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,


    function(decodedText) {

      if (!scanning) {
        return;
      }


      scanning = false;


      document.getElementById("code").value =
        decodedText;


      document.getElementById(
        "quantitySection"
      ).style.display = "block";


      scanner.stop();

    },


    function(errorMessage) {

      // Normal QR scanning errors are ignored.

    }

  )

  .then(function() {

    scanning = true;

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );


    showStatus(

      "Unable to start camera. " +
      "Please allow camera access.",

      false

    );

  });

}



/* =====================================================
   SAVE SCAN
===================================================== */

function saveScan() {


  const code =
    document.getElementById(
      "code"
    ).value.trim();


  const quantity =
    document.getElementById(
      "quantity"
    ).value;



  /* CHECK CODE */

  if (!code) {

    showStatus(

      "No QR code detected.",

      false

    );

    return;

  }



  /* CHECK QUANTITY */

  if (
    !quantity ||
    Number(quantity) <= 0
  ) {

    showStatus(

      "Please enter a valid quantity.",

      false

    );

    return;

  }



  /* DISABLE BUTTON */

  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;


  button.innerText =
    "SAVING...";



  /* =================================================
     BUILD GOOGLE APPS SCRIPT URL
  ================================================= */

  const url =

    scriptUrl +

    "?code=" +

    encodeURIComponent(code) +

    "&quantity=" +

    encodeURIComponent(quantity);



  /* =================================================
     SEND DATA TO GOOGLE APPS SCRIPT
  =================================================

     We use an invisible image request
     to avoid browser CORS problems.
  ================================================= */


  const request =
    new Image();



  request.onload = function() {


    showStatus(

      "Scan saved successfully!",

      true

    );


    button.disabled = false;


    button.innerText =
      "SAVE SCAN";



    /* CLEAR DATA */

    document.getElementById(
      "code"
    ).value = "";


    document.getElementById(
      "quantity"
    ).value = 1;



    /* START NEXT SCAN */

    setTimeout(function() {

      scanAgain();

    }, 1000);

  };



  request.onerror = function() {


    /*
      The request may still have reached
      Google Apps Script even if Safari
      doesn't report the response.

      We therefore tell the user to verify
      the Attendance Log.
    */


    showStatus(

      "Scan sent. Please check Attendance Log.",

      true

    );


    button.disabled = false;


    button.innerText =
      "SAVE SCAN";

  };



  request.src = url;

}



/* =====================================================
   SCAN AGAIN
===================================================== */

function scanAgain() {


  /* STOP OLD SCANNER */

  if (scanner) {

    try {

      scanner.stop();

    }

    catch (error) {

      console.log(error);

    }

  }



  /* HIDE QUANTITY SECTION */

  document.getElementById(
    "quantitySection"
  ).style.display = "none";



  /* HIDE STATUS */

  document.getElementById(
    "status"
  ).style.display = "none";



  /* CLEAR CAMERA AREA */

  document.getElementById(
    "reader"
  ).innerHTML = "";



  scanning = false;



  /* START NEW SCANNER */

  startScanner();

}



/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
  message,
  success
) {


  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    success
      ? "success"
      : "error";

}



/* =====================================================
   START WHEN PAGE LOADS
===================================================== */

window.onload = function() {

  startScanner();

};


</script>

</body>

</html>
