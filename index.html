<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    #counter {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #reader {
      width: 100%;
      margin: 10px auto;
    }

    #quantitySection {
      display: none;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 18px;
    }

    #quantity {
      text-align: center;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #saveButton {
      background: #1976d2;
      color: white;
    }

    #saveButton:disabled {
      background: #999;
    }

    #scanAgainButton {
      background: #555;
      color: white;
    }

    #status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block !important;
      background: #dff5e1;
      color: #176b20;
    }

    .error {
      display: block !important;
      background: #ffe0e0;
      color: #a00000;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>QR Attendance Scanner</h1>

  <div id="counter">
    Scans this session: 0
  </div>


  <div id="reader"></div>


  <div id="quantitySection">

    <label>Scanned Code</label>

    <input
      type="text"
      id="code"
      readonly
    >


    <label>Quantity</label>

    <input
      type="number"
      id="quantity"
      value="1"
      min="1"
      inputmode="numeric"
    >


    <button
      id="saveButton"
      onclick="saveScan()">

      SAVE SCAN

    </button>


    <button
      id="scanAgainButton"
      onclick="scanAgain()">

      SCAN AGAIN

    </button>

  </div>


  <div id="status"></div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const scriptUrl =
  "https://script.google.com/macros/s/AKfycby8wgmD0iGMz4083SKiI-YEqs2Sdu9Fsdd4uwabF-C1aVPGpiAGBym723hiE9KWVbJPHQ/exec";



/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let scanning = false;

let sessionScans = 0;



/* =====================================================
   START SCANNER
===================================================== */

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  scanner.start(

    {
      facingMode: "environment"
    },

    config,


    function(decodedText) {

      if (!scanning) {
        return;
      }


      scanning = false;


      document.getElementById("code").value =
        decodedText;


      /*
       * Quantity is automatically 1.
       */

      document.getElementById("quantity").value =
        1;


      document.getElementById(
        "quantitySection"
      ).style.display = "block";


      scanner.stop();

    },


    function(errorMessage) {

      // Ignore normal QR scanning errors.

    }

  )

  .then(function() {

    scanning = true;

  })

  .catch(function(error) {

    console.error(
      "Camera error:",
      error
    );


    showStatus(

      "Unable to start camera. " +
      "Please allow camera access.",

      false

    );

  });

}



/* =====================================================
   SAVE SCAN
===================================================== */

function saveScan() {

  const code =
    document.getElementById("code").value.trim();

  const quantity =
    document.getElementById("quantity").value;


  if (!code) {

    showStatus(
      "No QR code detected.",
      false
    );

    return;
  }


  if (!quantity || Number(quantity) <= 0) {

    showStatus(
      "Please enter a valid quantity.",
      false
    );

    return;
  }


  const button =
    document.getElementById("saveButton");


  button.disabled = true;
  button.innerText = "SAVING...";


  const url =
    scriptUrl +
    "?code=" +
    encodeURIComponent(code) +
    "&quantity=" +
    encodeURIComponent(quantity);


  fetch(url, {
    method: "GET"
  })

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Server returned HTTP " +
        response.status
      );

    }

    return response.text();

  })

  .then(function(text) {

    console.log(
      "Apps Script response:",
      text
    );


    let result;

    try {

      result =
        JSON.parse(text);

    } catch (error) {

      throw new Error(
        "Invalid response from Apps Script."
      );

    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "Apps Script could not save the scan."
      );

    }


    successfulSave(
      code,
      quantity
    );

  })

  .catch(function(error) {

    console.error(
      "Save error:",
      error
    );


    button.disabled = false;
    button.innerText = "SAVE SCAN";


    showStatus(

      "❌ Scan was NOT saved. " +
      error.message,

      false

    );

  });

}



  if (!quantity || Number(quantity) <= 0) {

    showStatus(
      "Please enter a valid quantity.",
      false
    );

    return;

  }



  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;

  button.innerText =
    "SAVING...";



  /* =================================================
     SEND TO GOOGLE APPS SCRIPT
  ================================================= */

  const url =

    scriptUrl +

    "?code=" +

    encodeURIComponent(code) +

    "&quantity=" +

    encodeURIComponent(quantity);



  const request =
    new Image();



  request.onload = function() {

    successfulSave(
      code,
      quantity
    );

  };


  request.onerror = function() {

    /*
     * Apps Script may save the record even if
     * Safari doesn't report the image response.
     */

    successfulSave(
      code,
      quantity
    );

  };


  request.src = url;

}



/* =====================================================
   SUCCESSFUL SAVE
===================================================== */

function successfulSave(
  code,
  quantity
) {


  sessionScans++;


  document.getElementById(
    "counter"
  ).innerText =

    "Scans this session: " +
    sessionScans;



  showStatus(

    "✓ Saved: " +
    code +
    " — Qty " +
    quantity,

    true

  );


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = false;

  button.innerText =
    "SAVE SCAN";



  /*
   * Clear previous scan.
   */

  document.getElementById(
    "code"
  ).value = "";


  document.getElementById(
    "quantity"
  ).value = 1;



  /*
   * Automatically return to scanner.
   */

  setTimeout(function() {

    scanAgain();

  }, 700);

}



/* =====================================================
   SCAN AGAIN
===================================================== */

function scanAgain() {


  if (scanner) {

    try {

      scanner.stop();

    }

    catch (error) {

      console.log(error);

    }

  }


  document.getElementById(
    "quantitySection"
  ).style.display = "none";


  document.getElementById(
    "status"
  ).style.display = "none";


  document.getElementById(
    "reader"
  ).innerHTML = "";


  scanning = false;


  startScanner();

}



/* =====================================================
   STATUS
===================================================== */

function showStatus(
  message,
  success
) {


  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    message;


  status.className =
    success
      ? "success"
      : "error";

}



/* =====================================================
   START PAGE
===================================================== */

window.onload = function() {

  startScanner();

};


</script>

</body>

</html>
